; Nile-Maple runtime PHP policy (doc 04 §7). Applies to public_html/** only.
; Anything not permitted on the plan (e.g. opcache jit) is simply ignored by PHP.

display_errors = Off
log_errors = On
error_log = ../storage/logs/php.log
expose_php = Off
date.timezone = Africa/Cairo

memory_limit = 128M
max_execution_time = 90
max_input_vars = 500
post_max_size = 12M
upload_max_filesize = 8M
max_file_uploads = 12
default_socket_timeout = 5

session.auto_start = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1800

; OPcache. validate_timestamps stays ON with a 2 s check: our deploys swap directories in
; place, and a stale-bytecode trap on shared hosting (no opcache_reset without CLI) costs
; more than one stat() per file per 2 s. Flip to 0 only if you also reset OPcache per deploy.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

realpath_cache_size = 4096k
realpath_cache_ttl = 600
